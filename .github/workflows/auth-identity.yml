name: Publish Glow login identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glow-login-identity
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the native callback declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Identity(HTMLParser):
              approved = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "link" and attrs.get("rel") == "redirect_uri" and attrs.get("href") == "glow-lighting://auth/callback":
                      self.approved = True
          identity = Identity()
          identity.feed(Path("auth-client/index.html").read_bytes()[:10000].decode())
          assert identity.approved, "Missing Home Assistant redirect_uri declaration"
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: auth-client
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
