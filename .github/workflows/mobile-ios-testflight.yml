name: Mobile iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: glow-ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Check signing configuration
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_DEVELOPMENT_TEAM IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See MOBILE.md → Release to TestFlight."
              missing=1
            fi
          done
          exit "$missing"
      - name: Prepare iOS toolchain
        run: |
          xcodebuild -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          command -v xcodegen || brew install xcodegen
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Add the privacy manifest
        working-directory: src-tauri/gen/apple
        run: |
          target_dir=$(find . -maxdepth 1 -type d -name '*_iOS' | head -n 1)
          test -n "$target_dir"
          cp ../../PrivacyInfo.xcprivacy "$target_dir/"
          xcodegen generate --spec project.yml
      - name: Build signed IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          # CFBundleVersion must increase for every upload of the same version.
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "Building $(node -p 'require("./package.json").version') ($build_number)"
          npm run tauri -- ios build --ci --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$build_number\"}}}"
      - name: Verify IPA contents
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          test -n "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          test -f "$app/PrivacyInfo.xcprivacy"
          plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist"
          plutil -extract NSLocalNetworkUsageDescription raw "$app/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$app/Info.plist"
          plutil -extract CFBundleVersion raw "$app/Info.plist"
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glow-ios-app-store
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 7
