<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Full-bleed opaque room plaster wall: Glow charcoal shifting from dawn slate to evening umber -->
    <linearGradient id="wall-bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d4051"/>
      <stop offset="45%" stop-color="#383c36"/>
      <stop offset="55%" stop-color="#3b3833"/>
      <stop offset="100%" stop-color="#4c2e22"/>
    </linearGradient>

    <!-- Subtle ambient bounce light on the center plaster wall so the obsidian sconce silhouettes crisply -->
    <radialGradient id="wall-bounce" cx="512" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#807d74" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#5a5851" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#373b35" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft ambient morning wall glow -->
    <radialGradient id="cool-ambient" cx="512" cy="282" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#82cbf7" stop-opacity="0.24"/>
      <stop offset="68%" stop-color="#5da5d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2d4051" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft ambient evening wall glow -->
    <radialGradient id="warm-ambient" cx="512" cy="742" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#df7855" stop-opacity="0.28"/>
      <stop offset="68%" stop-color="#b84f30" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4c2e22" stop-opacity="0"/>
    </radialGradient>

    <!-- Upper G1-smooth baffled light cone: crisp cool morning daylight (~6000K) -->
    <linearGradient id="cool-beam" x1="512" y1="468" x2="512" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fdff" stop-opacity="0.99"/>
      <stop offset="28%" stop-color="#c4e9fd" stop-opacity="0.94"/>
      <stop offset="66%" stop-color="#74bfec" stop-opacity="0.80"/>
      <stop offset="88%" stop-color="#55a2d4" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#468ec0" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Upper inner intense plume -->
    <linearGradient id="cool-core" x1="512" y1="468" x2="512" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="46%" stop-color="#dcf2fe" stop-opacity="0.64"/>
      <stop offset="100%" stop-color="#74bfec" stop-opacity="0"/>
    </linearGradient>

    <!-- Lower G1-smooth baffled light cone: cozy golden dusk to Glow terracotta (~2200K) -->
    <linearGradient id="warm-beam" x1="512" y1="556" x2="512" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.99"/>
      <stop offset="26%" stop-color="#ffbb73" stop-opacity="0.95"/>
      <stop offset="66%" stop-color="#df7855" stop-opacity="0.86"/>
      <stop offset="88%" stop-color="#c25433" stop-opacity="0.54"/>
      <stop offset="100%" stop-color="#a44124" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Lower inner intense plume -->
    <linearGradient id="warm-core" x1="512" y1="556" x2="512" y2="888" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.98"/>
      <stop offset="46%" stop-color="#ffaa5e" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#df7855" stop-opacity="0"/>
    </linearGradient>

    <!-- Continuous hourglass light stream pinching through the sconce throat -->
    <linearGradient id="throat-stream" x1="512" y1="464" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="36%" stop-color="#e3f4ff"/>
      <stop offset="50%" stop-color="#fff6e6"/>
      <stop offset="72%" stop-color="#ffc27a"/>
      <stop offset="100%" stop-color="#f08f52"/>
    </linearGradient>

    <!-- Deep matte-obsidian anodized sconce housing with subtle cylindrical highlight -->
    <linearGradient id="sconce-body" x1="512" y1="464" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#273035"/>
      <stop offset="18%" stop-color="#151716"/>
      <stop offset="48%" stop-color="#212422"/>
      <stop offset="54%" stop-color="#222320"/>
      <stop offset="82%" stop-color="#151514"/>
      <stop offset="100%" stop-color="#302019"/>
    </linearGradient>

    <!-- Precision chamfered rim bevel catching cool daylight above and warm terracotta below -->
    <linearGradient id="sconce-rim" x1="512" y1="464" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4e8fe" stop-opacity="0.76"/>
      <stop offset="30%" stop-color="#8b8e89" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#8b7f76" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59d62" stop-opacity="0.80"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed opaque room plaster wall -->
  <rect width="1024" height="1024" fill="url(#wall-bg)"/>
  <circle cx="512" cy="512" r="430" fill="url(#wall-bounce)"/>
  <circle cx="512" cy="282" r="430" fill="url(#cool-ambient)"/>
  <circle cx="512" cy="742" r="430" fill="url(#warm-ambient)"/>

  <!-- Upper G1-smooth baffled cone: Cool morning daylight -->
  <path d="M 422 468 L 202 214 C 145 148 280 104 512 104 C 744 104 879 148 822 214 L 602 468 Z"
        fill="url(#cool-beam)"/>
  <path d="M 456 468 L 310 218 C 276 160 368 132 512 132 C 656 132 748 160 714 218 L 568 468 Z"
        fill="url(#cool-core)"/>

  <!-- Lower G1-smooth baffled cone: Warm evening terracotta glow -->
  <path d="M 422 556 L 202 810 C 145 876 280 920 512 920 C 744 920 879 876 822 810 L 602 556 Z"
        fill="url(#warm-beam)"/>
  <path d="M 456 556 L 310 806 C 276 864 368 892 512 892 C 656 892 748 864 714 806 L 568 556 Z"
        fill="url(#warm-core)"/>

  <!-- Soft wall contact shadow behind the sconce fixture -->
  <rect x="336" y="470" width="352" height="96" rx="32" fill="#0d0e0d" opacity="0.46"/>

  <!-- Unified recessed sconce backplate -->
  <rect x="344" y="464" width="336" height="96" rx="28" fill="#121413"/>

  <!-- Glowing emitter aperture lips at top and bottom of sconce -->
  <rect x="420" y="462" width="184" height="6" rx="3" fill="#e6f6ff" opacity="0.88"/>
  <rect x="420" y="556" width="184" height="6" rx="3" fill="#ffd699" opacity="0.88"/>

  <!-- Luminous Venturi hourglass stream connecting cool day light into warm evening light -->
  <path d="M 480 464 Q 500 512 480 560 H 544 Q 524 512 544 464 Z" fill="url(#throat-stream)"/>

  <!-- Left wing of matte-obsidian architectural wall sconce -->
  <path d="M 372 464 H 480 Q 500 512 480 560 H 372 A 28 28 0 0 1 344 532 V 492 A 28 28 0 0 1 372 464 Z"
        fill="url(#sconce-body)" stroke="url(#sconce-rim)" stroke-width="3.5"/>

  <!-- Right wing of matte-obsidian architectural wall sconce -->
  <path d="M 544 464 H 652 A 28 28 0 0 1 680 492 V 532 A 28 28 0 0 1 652 560 H 544 Q 524 512 544 464 Z"
        fill="url(#sconce-body)" stroke="url(#sconce-rim)" stroke-width="3.5"/>
</svg>
